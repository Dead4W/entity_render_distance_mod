name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prop_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$version" != "$prop_version" ]; then
            echo "Tag ${tag} does not match gradle.properties mod_version=${prop_version}."
            echo "Bump mod_version, commit, then tag v${prop_version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: bash .github/scripts/gradle-with-retry.sh build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/renderdistancemod-${VERSION}.jar"
          if [ ! -f "$jar" ]; then
            echo "Expected jar not found: ${jar}"
            ls -la build/libs || true
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$jar" \
              --title "Render Distance Mod ${VERSION}" \
              --generate-notes
          fi
