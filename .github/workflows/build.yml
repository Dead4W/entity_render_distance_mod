name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set +e
          max_attempts=3
          delay=30
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Gradle build attempt ${attempt}/${max_attempts}"
            log="$(mktemp)"
            ./gradlew build 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Gradle build failed after ${max_attempts} attempts"
              exit "$status"
            fi
            if grep -Eqi 'Received status code 50[0-9]|Bad Gateway|Gateway Time-out|Could not GET |Could not GET resource|Connection reset|Connection timed out|Temporary failure in name resolution' "$log"; then
              echo "Transient Maven/network failure (exit ${status}). Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
              continue
            fi
            echo "Non-retryable Gradle failure (exit ${status})"
            exit "$status"
          done